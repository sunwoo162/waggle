# docker compose -f deploy/compose.yaml up -d --build
# Secrets live only in deploy/.env.production on the server (never committed).
services:
  waggle:
    build: ..
    restart: unless-stopped
    env_file: .env.production
    volumes:
      - waggle-data:/data
    expose:
      - "3000"
  caddy:
    image: caddy:2.10
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      WAGGLE_DOMAIN: ${WAGGLE_DOMAIN:?WAGGLE_DOMAIN을 지정하세요}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - waggle
volumes:
  waggle-data:
  caddy-data:
  caddy-config:
